<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тоног Төхөөрөмжийн Бүртгэл1</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans pb-10">

  <div class="max-w-7xl mx-auto px-4 py-6">
    <!-- Header -->
    <div class="flex flex-col md:flex-row justify-between items-center mb-6 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <div>
        <h1 class="text-2xl font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-server text-blue-600"></i> Тоног Төхөөрөмжийн Бүртгэлийн Систем V1.0
        </h1>
        <p class="text-slate-500 text-sm mt-1">Google Sheets-тэй холбогдсон онлайн систем</p>
      </div>
      <div class="mt-4 md:mt-0 flex gap-2">
        <button onclick="fetchData()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2">
          <i class="fa-solid fa-rotate-right" id="refresh-icon"></i> Шинэчлэх
        </button>
      </div>
    </div>

    <!-- Main Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Form -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
          <i class="fa-solid fa-plus-circle text-blue-600"></i> Шинэ Төхөөрөмж Бүртгэх
        </h2>
        <form id="equip-form" onsubmit="handleSubmit(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Нэр / Модель</label>
            <input type="text" id="name" required placeholder="Меркурий 234 / Teltonika TRB145" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Серийн дугаар (S/N)</label>
            <input type="text" id="sn" required placeholder="SN-894201" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Ангилал</label>
              <select id="category" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
                <option value="Тоолуур">Тоолуур</option>
                <option value="Модем / Хөрвүүлэгч">Модем / Хөрвүүлэгч</option>
                <option value="Сүлжээний төхөөрөмж">Сүлжээний төхөөрөмж</option>
                <option value="Бусад">Бусад</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Төлөв</label>
              <select id="status" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
                <option value="Ашиглагдаж байгаа">Ашиглагдаж байгаа</option>
                <option value="Бэлтгэлд байгаа">Бэлтгэлд байгаа</option>
                <option value="Засвартай">Засвартай</option>
              </select>
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Байршил / Дэд станц</label>
            <input type="text" id="location" required placeholder="Чойр ДС / Бөөрөлжүүт" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">IP хаяг</label>
              <input type="text" id="ip" placeholder="192.168.1.100" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Хариуцагч</label>
              <input type="text" id="owner" required placeholder="Инженер" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
          </div>
          <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition text-sm flex justify-center items-center gap-2">
            <i class="fa-solid fa-save"></i> Google Sheet-д хадгалах
          </button>
        </form>
      </div>

      <!-- Table View -->
      <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
          <i class="fa-solid fa-list text-blue-600"></i> Бүртгэлтэй Төхөөрөмжүүд
        </h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-slate-600">
            <thead class="bg-slate-50 text-slate-700 uppercase text-xs">
              <tr>
                <th class="p-3">Нэр & S/N</th>
                <th class="p-3">Ангилал</th>
                <th class="p-3">Байршил</th>
                <th class="p-3">Төлөв</th>
                <th class="p-3">Хариуцагч</th>
              </tr>
            </thead>
            <tbody id="data-list" class="divide-y">
              <tr>
                <td colspan="5" class="p-4 text-center text-slate-400">Мэдээлэл уншиж байна...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script>
    const https://script.google.com/macros/s/AKfycbwB22DJiIbX1UUkktYfLVpDVA3DbeDP-l5NwyyHG6FZB4koojHlGz6jnGyXqJe_jVw/exec";

    async function fetchData() {
      const refreshIcon = document.getElementById('refresh-icon');
      refreshIcon.classList.add('fa-spin');
      try {
        const res = await fetch(GOOGLE_APP_SCRIPT_URL);
        const data = await res.json();
        renderTable(data);
      } catch (err) {
        console.error(err);
        document.getElementById('data-list').innerHTML = `<tr><td colspan="5" class="p-4 text-center text-red-500">Мэдээлэл татахад алдаа гарлаа!</td></tr>`;
      } finally {
        refreshIcon.classList.remove('fa-spin');
      }
    }

    function renderTable(data) {
      const tbody = document.getElementById('data-list');
      if (!data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-400">Бүртгэгдсэн төхөөрөмж байхгүй байна.</td></tr>`;
        return;
      }
      tbody.innerHTML = data.map(item => `
        <tr class="hover:bg-slate-50">
          <td class="p-3">
            <div class="font-bold text-slate-800">${item.name}</div>
            <div class="text-xs text-slate-400">S/N: ${item.sn}</div>
          </td>
          <td class="p-3"><span class="bg-slate-100 text-slate-700 px-2 py-0.5 rounded text-xs">${item.category}</span></td>
          <td class="p-3">${item.location} <br><span class="text-xs text-slate-400">${item.ip || '-'}</span></td>
          <td class="p-3">
            <span class="px-2 py-0.5 rounded-full text-xs font-semibold ${
              item.status === 'Ашиглагдаж байгаа' ? 'bg-green-100 text-green-700' :
              item.status === 'Бэлтгэлд байгаа' ? 'bg-blue-100 text-blue-700' : 'bg-amber-100 text-amber-700'
            }">
              ${item.status}
            </span>
          </td>
          <td class="p-3">${item.owner}</td>
        </tr>
      `).join('');
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Хадгалж байна...`;

      const payload = {
        id: 'EQ-' + Date.now().toString().slice(-6),
        name: document.getElementById('name').value,
        sn: document.getElementById('sn').value,
        category: document.getElementById('category').value,
        location: document.getElementById('location').value,
        status: document.getElementById('status').value,
        ip: document.getElementById('ip').value,
        date: new Date().toISOString().split('T')[0],
        owner: document.getElementById('owner').value
      };

      try {
        await fetch(GOOGLE_APP_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        document.getElementById('equip-form').reset();
        setTimeout(fetchData, 1500);
      } catch (err) {
        alert('Алдаа гарлаа!');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-save"></i> Google Sheet-д хадгалах`;
      }
    }

    fetchData();
  </script>
</body>
</html>
