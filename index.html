<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тоног Төхөөрөмжийн Бүртгэлийн Систем V1.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SheetJS сан: Excel файл татахад ашиглана -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    @media print {
      body * {
        visibility: hidden;
      }
      #print-section, #print-section * {
        visibility: visible;
      }
      #print-section {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        padding: 20px;
        background: white;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans pb-10">

  <div class="max-w-7xl mx-auto px-4 py-6">
    <!-- Header -->
    <div class="flex flex-col md:flex-row justify-between items-center mb-6 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <div>
        <h1 class="text-2xl font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-server text-blue-600"></i> Тоног Төхөөрөмжийн Бүртгэлийн Систем V1.0
        </h1>
        <p class="text-slate-500 text-sm mt-1">Google Sheets-тэй холбогдсон онлайн систем</p>
      </div>
      <div class="mt-4 md:mt-0 flex gap-2">
        <button onclick="fetchData()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2">
          <i class="fa-solid fa-rotate-right" id="refresh-icon"></i> Шинэчлэх
        </button>
      </div>
    </div>

    <!-- Main Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Form -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 h-fit">
        <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2" id="form-title">
          <i class="fa-solid fa-plus-circle text-blue-600"></i> Төхөөрөмж Бүртгэх
        </h2>
        <form id="equip-form" onsubmit="handleSubmit(event)" class="space-y-4">
          <input type="hidden" id="edit-id" value="">
          
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Нэр / Модель</label>
            <input type="text" id="name" required placeholder="MOXA NPORT / Meanwell PS220A/24VDC" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Хөрөнгийн дугаар</label>
            <input type="text" id="sn" required placeholder="xxxx-xx-xxx" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
          </div>
          
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Ангилал</label>
              <select id="category" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
                <option value="Тоолуур">Тоолуур</option>
                <option value="Сервер">Сервер</option>
                <option value="Тэжээлийн хэсэг">Тэжээлийн хэсэг</option>
                <option value="Модем/Хөрвүүлэгч">Модем/Хөрвүүлэгч</option>
                <option value="Сүлжээний төхөөрөмж">Сүлжээний төхөөрөмж</option>
                <option value="Кабель">Кабель</option>
                <option value="Бусад">Бусад</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Төлөв</label>
              <select id="status" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
                <option value="Ашиглагдаж байгаа">Ашиглагдаж байгаа</option>
                <option value="Нөөцөд байгаа">Нөөцөд байгаа</option>
                <option value="Гэмтэлтэй">Гэмтэлтэй</option>
                <option value="Актлагдсан">Актлагдсан</option>
              </select>
            </div>
          </div>

          <!-- Талбар: Тоо ширхэг ба Хэмжих нэгж -->
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Тоо ширхэг</label>
              <input type="number" id="qty" required value="1" min="1" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Хэмжих нэгж</label>
              <select id="unit" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
                <option value="ширхэг">ширхэг</option>
                <option value="метр">метр</option>
                <option value="багц">багц</option>
                <option value="иж бүрэн">иж бүрэн</option>
                <option value="хайрцаг">хайрцаг</option>
              </select>
            </div>
          </div>

          <!-- Талбар: Ашиглалтад орсон он сар өдөр -->
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Ашиглалтад орсон он</label>
            <input type="date" id="commissionDate" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Байршил / Дэд станц</label>
            <input type="text" id="location" required placeholder="Чойр дэд станц" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
          </div>
          
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">IP / Порт</label>
              <input type="text" id="ip" placeholder="192.168.10.45:4001" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Хариуцагч</label>
              <input type="text" id="owner" required placeholder="Ц.Ганзориг" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
          </div>

          <div class="flex gap-2 pt-2">
            <button type="submit" id="submit-btn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition text-sm flex justify-center items-center gap-2">
              <i class="fa-solid fa-save"></i> Google Sheet-д хадгалах
            </button>
            <button type="button" id="cancel-btn" onclick="resetForm()" class="hidden bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2.5 rounded-lg text-sm font-medium transition">
              Цуцлах
            </button>
          </div>
        </form>
      </div>

      <!-- Table View -->
      <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <!-- Controls & Filters -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
          <div>
            <h2 class="text-lg font-bold text-slate-800">Бүртгэлтэй төхөөрөмжүүд</h2>
            <p class="text-xs text-slate-500 mt-0.5">Шүүгдсэн: <span id="filtered-count" class="font-bold text-blue-600">0</span></p>
          </div>
          
          <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
            <!-- Search -->
            <div class="relative flex-1 md:w-36">
              <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
              <input type="text" id="search-input" oninput="applyFilters()" placeholder="Хайх..." class="w-full pl-8 pr-3 py-1.5 border rounded-lg text-xs focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Location Filter (Зөвхөн ганц байршил шүүгч үлдээсэн) -->
            <select id="filter-location" onchange="applyFilters()" class="border rounded-lg px-2 py-1.5 text-xs text-slate-600 bg-white max-w-[130px]">
              <option value="">Бүх байршил</option>
            </select>
            
            <!-- Category Filter -->
            <select id="filter-category" onchange="applyFilters()" class="border rounded-lg px-2 py-1.5 text-xs text-slate-600 bg-white">
              <option value="">Бүх ангилал</option>
              <option value="Тоолуур">Тоолуур</option>
              <option value="Сервер">Сервер</option>
              <option value="Тэжээлийн хэсэг">Тэжээлийн хэсэг</option>
              <option value="Модем/Хөрвүүлэгч">Модем/Хөрвүүлэгч</option>
              <option value="Сүлжээний төхөөрөмж">Сүлжээний төхөөрөмж</option>
              <option value="Кабель">Кабель</option>
              <option value="Бусад">Бусад</option>
            </select>

            <!-- Status Filter -->
            <select id="filter-status" onchange="applyFilters()" class="border rounded-lg px-2 py-1.5 text-xs text-slate-600 bg-white">
              <option value="">Бүх төлөв</option>
              <option value="Ашиглагдаж байгаа">Ашиглагдаж байгаа</option>
              <option value="Нөөцөд байгаа">Нөөцөд байгаа</option>
              <option value="Гэмтэлтэй">Гэмтэлтэй</option>
              <option value="Актлагдсан">Актлагдсан</option>
            </select>

            <!-- Excel Export Button -->
            <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1.5">
              <i class="fa-solid fa-file-excel"></i> Excel
            </button>

            <!-- PDF Report Button -->
            <button onclick="printPDFReport()" class="bg-rose-600 hover:bg-rose-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1.5">
              <i class="fa-solid fa-print"></i> Тайлан
            </button>
          </div>
        </div>

        <!-- Table -->
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs text-slate-600">
            <thead class="bg-slate-50 text-slate-700 uppercase font-semibold">
              <tr>
                <th class="p-3">ХӨРӨНГӨНИЙ ДУГААР & НЭР</th>
                <th class="p-3">ТОО / НЭГЖ</th>
                <th class="p-3">АШИГЛАЛТАД ОРСОН</th>
                <th class="p-3">БАЙРШИЛ</th>
                <th class="p-3">ТӨЛӨВ</th>
                <th class="p-3">IP / ПОРТ</th>
                <th class="p-3">ХАРИУЦАГЧ</th>
                <th class="p-3 text-right">ҮЙЛДЭЛ</th>
              </tr>
            </thead>
            <tbody id="data-list" class="divide-y">
              <tr>
                <td colspan="8" class="p-4 text-center text-slate-400">Мэдээлэл уншиж байна...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <div id="print-section" class="hidden"></div>

  <script>
    const GOOGLE_APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwB22DJiIbX1UUkktYfLVpDVA3DbeDP-l5NwyyHG6FZB4koojHlGz6jnGyXqJe_jVw/exec";

    let rawData = [];
    let currentFilteredData = [];

    async function fetchData() {
      const refreshIcon = document.getElementById('refresh-icon');
      refreshIcon.classList.add('fa-spin');
      try {
        const res = await fetch(GOOGLE_APP_SCRIPT_URL, { redirect: 'follow' });
        const data = await res.json();
        rawData = Array.isArray(data) ? data : [];
        populateLocationFilter(rawData);
        applyFilters();
      } catch (err) {
        console.error("Fetch error:", err);
        document.getElementById('data-list').innerHTML = '<tr><td colspan="8" class="p-4 text-center text-red-500">Мэдээлэл татахад алдаа гарлаа!</td></tr>';
      } finally {
        refreshIcon.classList.remove('fa-spin');
      }
    }

    function populateLocationFilter(data) {
      const locationSelect = document.getElementById('filter-location');
      const currentValue = locationSelect.value;
      
      const locations = [...new Set(data.map(item => item.location).filter(Boolean))].sort();

      locationSelect.innerHTML = '<option value="">Бүх байршил</option>';
      locations.forEach(loc => {
        const option = document.createElement('option');
        option.value = loc;
        option.textContent = loc;
        locationSelect.appendChild(option);
      });

      locationSelect.value = currentValue;
    }

    function formatDate(rawDate) {
      if (!rawDate) return '';
      const str = String(rawDate);
      if (str.includes('T')) {
        return str.split('T')[0];
      }
      return str;
    }

    function applyFilters() {
      const search = document.getElementById('search-input').value.toLowerCase();
      const loc = document.getElementById('filter-location').value;
      const cat = document.getElementById('filter-category').value;
      const status = document.getElementById('filter-status').value;

      currentFilteredData = rawData.filter(item => {
        const matchSearch = !search || 
          (item.name && String(item.name).toLowerCase().includes(search)) ||
          (item.sn && String(item.sn).toLowerCase().includes(search)) ||
          (item.location && String(item.location).toLowerCase().includes(search)) ||
          (item.ip && String(item.ip).toLowerCase().includes(search)) ||
          (item.owner && String(item.owner).toLowerCase().includes(search));

        const matchLoc = !loc || item.location === loc;
        const matchCat = !cat || item.category === cat;
        const matchStatus = !status || item.status === status;

        return matchSearch && matchLoc && matchCat && matchStatus;
      });

      document.getElementById('filtered-count').innerText = currentFilteredData.length;
      renderTable(currentFilteredData);
    }

    function renderTable(data) {
      const tbody = document.getElementById('data-list');
      if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="p-4 text-center text-slate-400">Тохирох төхөөрөмж олдсонгүй.</td></tr>';
        return;
      }
      tbody.innerHTML = data.map(item => `
        <tr class="hover:bg-slate-50 transition">
          <td class="p-3 font-semibold text-slate-800">
            ${item.sn || '-'}
            <div class="text-[10px] font-normal text-slate-400">${item.name || ''}</div>
          </td>
          <td class="p-3 font-medium text-slate-700">
            ${item.qty || 1} ${item.unit || 'ширхэг'}
          </td>
          <td class="p-3 font-mono text-slate-600">
            ${formatDate(item.commissionDate) || '-'}
          </td>
          <td class="p-3">
            <div class="flex items-center gap-1">
              <i class="fa-solid fa-location-dot text-slate-400"></i> ${item.location || '-'}
            </div>
          </td>
          <td class="p-3">
            <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold inline-flex items-center gap-1 ${
              item.status === 'Ашиглагдаж байгаа' ? 'bg-emerald-100 text-emerald-700' :
              item.status === 'Нөөцөд байгаа' ? 'bg-amber-100 text-amber-700' : 
              item.status === 'Гэмтэлтэй' ? 'bg-rose-100 text-rose-700' : 'bg-slate-200 text-slate-700'
            }">
              ● ${item.status || '-'}
            </span>
          </td>
          <td class="p-3 font-mono text-slate-500">${item.ip || '-'}</td>
          <td class="p-3">
            <div class="flex items-center gap-1">
              <i class="fa-solid fa-user text-slate-400"></i> ${item.owner || '-'}
            </div>
          </td>
          <td class="p-3 text-right">
            <button onclick='editItem(${JSON.stringify(item)})' class="text-blue-600 hover:text-blue-800 px-1"><i class="fa-solid fa-pen-to-square"></i></button>
            <button onclick='deleteItem("${item.id}")' class="text-rose-600 hover:text-rose-800 px-1"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>
      `).join('');
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Хадгалж байна...';

      const editId = document.getElementById('edit-id').value;

      const payload = {
        action: editId ? 'update' : 'create',
        id: editId || ('EQ-' + Date.now().toString().slice(-6)),
        name: document.getElementById('name').value,
        sn: document.getElementById('sn').value,
        category: document.getElementById('category').value,
        status: document.getElementById('status').value,
        qty: document.getElementById('qty').value,
        unit: document.getElementById('unit').value,
        commissionDate: document.getElementById('commissionDate').value,
        location: document.getElementById('location').value,
        ip: document.getElementById('ip').value,
        date: new Date().toISOString().split('T')[0],
        owner: document.getElementById('owner').value
      };

      try {
        await fetch(GOOGLE_APP_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        resetForm();
        setTimeout(fetchData, 1500);
      } catch (err) {
        alert('Алдаа гарлаа!');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-save"></i> Google Sheet-д хадгалах';
      }
    }

    function editItem(item) {
      document.getElementById('edit-id').value = item.id;
      document.getElementById('name').value = item.name || '';
      document.getElementById('sn').value = item.sn || '';
      document.getElementById('category').value = item.category || 'Тоолуур';
      document.getElementById('status').value = item.status || 'Ашиглагдаж байгаа';
      document.getElementById('qty').value = item.qty || 1;
      document.getElementById('unit').value = item.unit || 'ширхэг';
      document.getElementById('commissionDate').value = formatDate(item.commissionDate) || '';
      document.getElementById('location').value = item.location || '';
      document.getElementById('ip').value = item.ip || '';
      document.getElementById('owner').value = item.owner || '';

      document.getElementById('form-title').innerHTML = '<i class="fa-solid fa-pen-to-square text-blue-600"></i> Төхөөрөмж Засах';
      document.getElementById('cancel-btn').classList.remove('hidden');
    }

    function resetForm() {
      document.getElementById('edit-id').value = '';
      document.getElementById('equip-form').reset();
      document.getElementById('qty').value = 1;
      document.getElementById('form-title').innerHTML = '<i class="fa-solid fa-plus-circle text-blue-600"></i> Төхөөрөмж Бүртгэх';
      document.getElementById('cancel-btn').classList.add('hidden');
    }

    async function deleteItem(id) {
      if (!confirm('Энэ төхөөрөмжийг устгахдаа итгэлтэй байна уу?')) return;
      
      try {
        await fetch(GOOGLE_APP_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'delete', id: id })
        });
        setTimeout(fetchData, 1500);
      } catch (err) {
        alert('Устгахад алдаа гарлаа!');
      }
    }

    function exportToExcel() {
      const dataToExport = currentFilteredData.length > 0 ? currentFilteredData : rawData;
      if (!dataToExport || dataToExport.length === 0) {
        alert('Татах дата олдсонгүй!');
        return;
      }

      const excelData = dataToExport.map(row => ({
        'ID': row.id || '',
        'Нэр / Модель': row.name || '',
        'Серийн дугаар': row.sn || '',
        'Ангилал': row.category || '',
        'Тоо': row.qty || 1,
        'Хэмжих нэгж': row.unit || 'ширхэг',
        'Ашиглалтад орсон он': formatDate(row.commissionDate),
        'Байршил': row.location || '',
        'Төлөв': row.status || '',
        'IP хаяг': row.ip || '',
        'Бүртгэсэн огноо': formatDate(row.date),
        'Хариуцагч': row.owner || ''
      }));

      const worksheet = XLSX.utils.json_to_sheet(excelData);
      worksheet['!cols'] = [
        { wch: 12 }, { wch: 25 }, { wch: 18 }, { wch: 20 },
        { wch: 8 }, { wch: 12 }, { wch: 18 }, { wch: 22 },
        { wch: 18 }, { wch: 16 }, { wch: 14 }, { wch: 18 }
      ];

      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Төхөөрөмжүүд");
      XLSX.writeFile(workbook, `Equipment_Export_${new Date().toISOString().split('T')[0]}.xlsx`);
    }

    function printPDFReport() {
      const dataToExport = currentFilteredData.length > 0 ? currentFilteredData : rawData;
      if (!dataToExport || dataToExport.length === 0) {
        alert('Тайлан гаргах мэдээлэл олдсонгүй!');
        return;
      }

      const total = dataToExport.length;
      const active = dataToExport.filter(d => d.status === 'Ашиглагдаж байгаа').length;
      const standby = dataToExport.filter(d => d.status === 'Нөөцөд байгаа').length;
      const repair = dataToExport.filter(d => d.status === 'Гэмтэлтэй').length;

      const printArea = document.getElementById('print-section');
      
      printArea.innerHTML = `
        <div style="font-family: Arial, sans-serif; color: #1e293b; max-width: 900px; margin: 0 auto;">
          <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2563eb; padding-bottom: 12px; margin-bottom: 15px;">
            <div>
              <h1 style="font-size: 20px; font-weight: bold; margin: 0; color: #1e293b;">ТОНОГ ТӨХӨӨРӨМЖИЙН НЭГДСЭН ТАЙЛАН</h1>
              <p style="font-size: 11px; color: #64748b; margin: 4px 0 0 0;">Огноо: ${new Date().toISOString().split('T')[0]} | Систем: Equipment Registry V1.0</p>
            </div>
          </div>

          <div style="display: flex; gap: 10px; margin-bottom: 20px; background: #f8fafc; padding: 12px; border-radius: 6px; border: 1px solid #e2e8f0; font-size: 12px;">
            <div style="flex: 1;"><b>Нийт төхөөрөмж:</b> ${total}</div>
            <div style="flex: 1; color: #166534;"><b>Ашиглагдаж буй:</b> ${active}</div>
            <div style="flex: 1; color: #b45309;"><b>Нөөцөд:</b> ${standby}</div>
            <div style="flex: 1; color: #be123c;"><b>Гэмтэлтэй:</b> ${repair}</div>
          </div>

          <table style="width: 100%; border-collapse: collapse; font-size: 11px; text-align: left;">
            <thead>
              <tr style="background-color: #2563eb; color: white;">
                <th style="padding: 8px; border: 1px solid #cbd5e1;">Хөрөнгийн дугаар & Нэр</th>
                <th style="padding: 8px; border: 1px solid #cbd5e1;">Тоо / Нэгж</th>
                <th style="padding: 8px; border: 1px solid #cbd5e1;">Ашиглалтад орсон</th>
                <th style="padding: 8px; border: 1px solid #cbd5e1;">Байршил</th>
                <th style="padding: 8px; border: 1px solid #cbd5e1;">Төлөв</th>
                <th style="padding: 8px; border: 1px solid #cbd5e1;">IP / Порт</th>
                <th style="padding: 8px; border: 1px solid #cbd5e1;">Хариуцагч</th>
              </tr>
            </thead>
            <tbody>
              ${dataToExport.map(item => `
                <tr style="border-bottom: 1px solid #e2e8f0;">
                  <td style="padding: 6px 8px; border: 1px solid #cbd5e1;">
                    <b>${item.sn || '-'}</b><br>
                    <span style="font-size: 10px; color: #64748b;">${item.name || ''}</span>
                  </td>
                  <td style="padding: 6px 8px; border: 1px solid #cbd5e1;">${item.qty \vert{}\vert{} 1}${item.unit || 'ширхэг'}</td>
                  <td style="padding: 6px 8px; border: 1px solid #cbd5e1;">${formatDate(item.commissionDate) || '-'}</td>
                  <td style="padding: 6px 8px; border: 1px solid #cbd5e1;">${item.location || '-'}</td>
                  <td style="padding: 6px 8px; border: 1px solid #cbd5e1;">${item.status || '-'}</td>
                  <td style="padding: 6px 8px; border: 1px solid #cbd5e1;">${item.ip || '-'}</td>
                  <td style="padding: 6px 8px; border: 1px solid #cbd5e1;">${item.owner || '-'}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>

          <div style="margin-top: 40px; font-size: 12px; color: #475569; display: flex; flex-direction: column; gap: 15px;">
            <div>Тайлан гаргасан инженер: ....................................... /                     /</div>
            <div>Хянасан ахлах инженер: ....................................... /                     /</div>
          </div>
        </div>
      `;

      printArea.classList.remove('hidden');
      window.print();
      printArea.classList.add('hidden');
    }

    fetchData();
  </script>
</body>
</html>
